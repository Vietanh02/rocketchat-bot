server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The portal is a single-page app: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser needs no CORS grant.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Knowledge base uploads: up to 20 files of 20 MB each are read in one go.
    location = /api/knowledge/documents {
        client_max_body_size 400m;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
    }
}
