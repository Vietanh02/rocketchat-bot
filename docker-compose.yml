# The bot and its portal. Rocket.Chat itself stays in rocketchat_server/.
#
#   cd rocketchat_server && docker compose up -d     # chat server first
#   cd .. && docker compose up -d --build            # then the bot
#
# The two stacks are joined by the external network below, so the bot can
# reach Rocket.Chat at http://rocketchat:3000 instead of going via the host.
#
# Settings for the whole stack go in a .env file next to this one (see
# .env.example): the proxy, APP_DEBUG and APP_TLS_VERIFY.

# Outgoing proxy, from .env. The containers' own names never go through it;
# NO_PROXY in .env adds to that list (e.g. a Rocket.Chat on the LAN).
x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-${HTTP_PROXY:-}}
  NO_PROXY: localhost,127.0.0.1,::1,backend,portal,qdrant,embed,rocketchat,host.docker.internal${NO_PROXY:+,}${NO_PROXY:-}

# The same proxy while images are built (pip install, npm ci).
x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-${HTTP_PROXY:-}}
  NO_PROXY: ${NO_PROXY:-}
  # "false" also skips certificate checks of pip and npm downloads.
  BUILD_TLS_VERIFY: ${APP_TLS_VERIFY:-true}

services:
  backend:
    build:
      context: ./backend
      args: *proxy-build-args
    # Named, so images loaded from a release package are used as they are
    # (`docker compose up -d --no-build`). BOT_VERSION defaults to "latest".
    image: rocketchat-bot-backend:${BOT_VERSION:-latest}
    restart: unless-stopped
    env_file:
      # Optional: copy backend/.env.example to backend/.env to use it.
      - path: ./backend/.env
        required: false
    environment:
      <<: *proxy-env
      # Troubleshooting: APP_DEBUG=true docker compose up -d backend
      # (DEBUG logs, tracebacks, the cause of errors shown in chat).
      APP_DEBUG: ${APP_DEBUG:-false}
      # false: do not check HTTPS/WSS certificates (a proxy that re-signs them).
      APP_TLS_VERIFY: ${APP_TLS_VERIFY:-true}
      # Rounds of tool calls in one answer (1-100); then it answers without tools.
      APP_MAX_TOOL_ROUNDS: ${APP_MAX_TOOL_ROUNDS:-20}
      # Container-to-container addresses override whatever .env holds.
      APP_DATABASE_URL: sqlite+aiosqlite:////app/data/bot.db
      APP_RC_REST_URL: ${APP_RC_REST_URL:-http://rocketchat:3000}
      APP_RC_WS_URL: ${APP_RC_WS_URL:-ws://rocketchat:3000/websocket}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8080}
      APP_SCRIPTS_DIR: /app/scripts
      APP_SKILLS_DIR: /app/skills
      APP_KB_IMPORT_DIR: /app/kb_import
      APP_MCP_SERVERS_DIR: /app/mcp_servers
      APP_QDRANT_URL: ${APP_QDRANT_URL:-http://qdrant:6333}
    depends_on:
      - qdrant
    volumes:
      - bot_data:/app/data
      # Script commands. Read-only: the bot runs these files, never writes them.
      # Edits on the host apply on the next run, with no rebuild.
      - ./scripts:/app/scripts:ro
      # Skills: a folder each with a SKILL.md (see skills/_example). Read-only too.
      - ./skills:/app/skills:ro
      # Folders to import into the knowledge base (e.g. a Confluence export),
      # copied here and imported from the Knowledge base page.
      - ./kb_import:/app/kb_import:ro
      # MCP servers started over stdio run in this folder: a Python server kept
      # here is set up as command `python`, arguments `<folder>/server.py`.
      - ./mcp_servers:/app/mcp_servers:ro
    # MCP servers running on the host are reached at http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - botnet
      - rocketchat
    expose:
      - "8000"

  # Vectors for the assistant's memory (and later its knowledge base).
  # Reached only by the backend, on the internal network.
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    mem_limit: 512m
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - botnet
    expose:
      - "6333"

  # Embedding model for the vector database, on this machine: no API calls,
  # nothing leaves the server. Up to 1.5 GB of RAM while loading. In the portal (Memory):
  # provider "text-embeddings-inference", URL http://embed:80, prefixes
  # "query: " and "passage: " (e5 models are trained with them).
  #
  # The model is built into the image when embed/model/ holds it
  # (deploy/fetch-embed-model.sh): no huggingface.co needed. Otherwise it is
  # downloaded into the embed_models volume on first start, via the proxy.
  embed:
    build: ./embed
    image: rocketchat-bot-embed:${BOT_VERSION:-latest}
    restart: unless-stopped
    # Loading the ONNX model peaks above 1 GB; it settles lower once running.
    mem_limit: 1536m
    environment: *proxy-env
    # Two tokenizer workers and small batches keep warm-up under the limit;
    # the defaults (one worker per core, 16k-token batches) get it OOM-killed.
    # The model is chosen by embed/start.sh.
    command: ["--tokenization-workers", "2", "--max-batch-tokens", "4096", "--max-client-batch-size", "64"]
    volumes:
      - embed_models:/data
    networks:
      - botnet
    expose:
      - "80"

  portal:
    build:
      context: ./portal
      args: *proxy-build-args
    image: rocketchat-bot-portal:${BOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORTAL_PORT:-8081}:80"
    networks:
      - botnet

volumes:
  bot_data:
  qdrant_data:
  embed_models:

networks:
  botnet:
  rocketchat:
    # Created by rocketchat_server/docker-compose.yml. Start that stack first.
    external: true
    name: rocketchat_server_default
