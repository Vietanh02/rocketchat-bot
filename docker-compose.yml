# The bot and its portal. Rocket.Chat itself stays in rocketchat_server/.
#
#   cd rocketchat_server && docker compose up -d     # chat server first
#   cd .. && docker compose up -d --build            # then the bot
#
# The two stacks are joined by the external network below, so the bot can
# reach Rocket.Chat at http://rocketchat:3000 instead of going via the host.

services:
  backend:
    build: ./backend
    # Named, so images loaded from a release package are used as they are
    # (`docker compose up -d --no-build`). BOT_VERSION defaults to "latest".
    image: rocketchat-bot-backend:${BOT_VERSION:-latest}
    restart: unless-stopped
    env_file:
      # Optional: copy backend/.env.example to backend/.env to use it.
      - path: ./backend/.env
        required: false
    environment:
      # Container-to-container addresses override whatever .env holds.
      APP_DATABASE_URL: sqlite+aiosqlite:////app/data/bot.db
      APP_RC_REST_URL: ${APP_RC_REST_URL:-http://rocketchat:3000}
      APP_RC_WS_URL: ${APP_RC_WS_URL:-ws://rocketchat:3000/websocket}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8080}
      APP_SCRIPTS_DIR: /app/scripts
      APP_SKILLS_DIR: /app/skills
      APP_QDRANT_URL: ${APP_QDRANT_URL:-http://qdrant:6333}
    depends_on:
      - qdrant
    volumes:
      - bot_data:/app/data
      # Script commands. Read-only: the bot runs these files, never writes them.
      # Edits on the host apply on the next run, with no rebuild.
      - ./scripts:/app/scripts:ro
      # Skills: a folder each with a SKILL.md (see skills/_example). Read-only too.
      - ./skills:/app/skills:ro
    # MCP servers running on the host are reached at http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - botnet
      - rocketchat
    expose:
      - "8000"

  # Vectors for the assistant's memory (and later its knowledge base).
  # Reached only by the backend, on the internal network.
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    mem_limit: 512m
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - botnet
    expose:
      - "6333"

  # Embedding model for the vector database, on this machine: no API calls,
  # nothing leaves the server. Up to 1.5 GB of RAM while loading. In the portal (Memory):
  # provider "text-embeddings-inference", URL http://embed:80, prefixes
  # "query: " and "passage: " (e5 models are trained with them). The model is
  # downloaded into the embed_models volume on first start.
  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    restart: unless-stopped
    # Loading the ONNX model peaks above 1 GB; it settles lower once running.
    mem_limit: 1536m
    # Two tokenizer workers and small batches keep warm-up under the limit;
    # the defaults (one worker per core, 16k-token batches) get it OOM-killed.
    command: ["--model-id", "intfloat/multilingual-e5-small", "--tokenization-workers", "2", "--max-batch-tokens", "4096", "--max-client-batch-size", "64"]
    volumes:
      - embed_models:/data
    networks:
      - botnet
    expose:
      - "80"

  portal:
    build: ./portal
    image: rocketchat-bot-portal:${BOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORTAL_PORT:-8081}:80"
    networks:
      - botnet

volumes:
  bot_data:
  qdrant_data:
  embed_models:

networks:
  botnet:
  rocketchat:
    # Created by rocketchat_server/docker-compose.yml. Start that stack first.
    external: true
    name: rocketchat_server_default
